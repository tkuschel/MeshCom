name: Automated Fork CI

on:
  push:
    branches:
    - build-fork-ci
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Which branch do you want to build and test?'
        required: true
        default: 'main'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # CRITICAL: Ensures this workflow only runs inside your personal fork
    if: github.repository == 'tkuschel/MeshCom'

    permissions:
      contents: read # Changed from write since we don't create an official Release anymore

    steps:
    # 1. Checkout the target feature branch instead of the workflow branch
    - name: Checkout Target Branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.target_branch || github.ref }}

    - uses: actions/cache@v5
      with:
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
        key: ${{ runner.os }}-pio

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    # using --quiet to keep the pip installation logs clean and readable
    - name: Install PlatformIO Core
      run: pip install --quiet --upgrade platformio

    - name: Install esptool extension
      run: pip install --quiet --upgrade intelhex

    - name: Install RAK Deps
      run: pio pkg install --silent --global --platform nordicnrf52

    - name: Install ESP32 platform
      run: pio pkg install --silent --global --platform espressif32

    - name: Add T-Beam Supreme board definition
      run: "mkdir -p ~/.platformio/platforms/espressif32/boards && wget --quiet -O ~/.platformio/platforms/espressif32/boards/t-beams3-supreme.json https://raw.githubusercontent.com/Xinyuan-LilyGO/LilyGo-LoRa-Series/master/boards/t-beams3-supreme.json && cat ~/.platformio/platforms/espressif32/boards/t-beams3-supreme.json"

    - name: Build all Projects
    # Adjusted flags: warnings are shown, but framework debug output is limited to WARN (level 2)
      env:
        PLATFORMIO_BUILD_FLAGS: "-DCORE_DEBUG_LEVEL=2"
      run: "cd ${{ github.workspace }} && pio run"

    - name: Convert RAK to UF2
      run: "wget --quiet https://raw.githubusercontent.com/microsoft/uf2/refs/heads/master/utils/uf2conv.py && wget --quiet https://raw.githubusercontent.com/microsoft/uf2/refs/heads/master/utils/uf2families.json && python3 uf2conv.py .pio/build/wiscore_rak4631/firmware.hex -c -o .pio/build/wiscore_rak4631/wiscore_rak4631.uf2 -f 0xADA52840"

    - name: Convert HELTEC_T114 to UF2
      run: "wget --quiet https://raw.githubusercontent.com/microsoft/uf2/refs/heads/master/utils/uf2conv.py && wget --quiet https://raw.githubusercontent.com/microsoft/uf2/refs/heads/master/utils/uf2families.json && python3 uf2conv.py .pio/build/heltec_t114/firmware.hex -c -o .pio/build/heltec_t114/heltec_t114.uf2 -f 0xADA52840"

    - name: Convert T_ECHO to UF2
      run: "wget --quiet https://raw.githubusercontent.com/microsoft/uf2/refs/heads/master/utils/uf2conv.py && wget --quiet https://raw.githubusercontent.com/microsoft/uf2/refs/heads/master/utils/uf2families.json && python3 uf2conv.py .pio/build/t_echo/firmware.hex -c -o .pio/build/t_echo/t_echo.uf2 -f 0xADA52840"

    - name: Rename Files and Print Progress
      run: |
        echo "=== Starting File Renaming Process ==="

        echo "Processing DevKitC and T-Deck boards..."
        # Automatically loop through all build directories to rename firmware files dynamically
        # This handles DevKitC, Heltec, TTGO, LilyGo, and any future boards automatically
        for dir in .pio/build/*/; do
          if [ -d "$dir" ]; then
            # Extract the pure board name from the directory path
            board=$(basename "$dir")

            # 1. Rename standard ESP32 firmware binaries
            if [ -f "${dir}firmware.bin" ]; then
              echo "Processing binary for board: $board"
              mv "${dir}firmware.bin" "${dir}${board}.bin"
            fi

            # 2. Rename NRF52 / Nordic ZIP archives (e.g., RAK4631, T-Echo)
            if [ -f "${dir}firmware.zip" ] && [ "$board" != "esp32-S3-safeboot" ]; then
              echo "Processing ZIP for board: $board"
              mv "${dir}firmware.zip" "${dir}${board}.zip"
            fi
          fi
        done

        # Handle the unique exceptions manually
        echo "Processing special bootloaders..."
        if [ -f .pio/build/esp32-S3-safeboot/bootloader.bin ]; then
          mv .pio/build/esp32-S3-safeboot/bootloader.bin .pio/build/esp32-S3-safeboot/bootloader-s3.bin
        fi

        echo "=== File Renaming Successfully Completed ==="
        echo "Listing renamed files in build directory:"
        find .pio/build/ -name "*.bin" -o -name "*.zip" -o -name "*.uf2"

    # 2. Upload all built files as GitHub Workflow Artifacts instead of creating a release
    - name: Upload Compiled Firmware Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: firmware-build-${{ github.event.inputs.target_branch || github.ref_name }}
        path: |
          safeboot.bin
          safeboot-s3.bin
          .pio/build/**/*.bin
          .pio/build/**/*.zip
          .pio/build/**/*.uf2
        retention-days: 7 # Artifacts will be automatically deleted after 7 days

    # Dynamically create the smart flashing scripts next to the T-Beam binary
    # with optional bootloader detection and group check
    - name: Create Desktop Flashing Scripts
      run: |
        # 1. Create the smart Linux Shell Script
        cat << 'EOF' > .pio/build/ttgo_tbeam/flash_tbeam.sh
        #!/usr/bin/env bash
        GREEN='\033[0;32m'
        RED='\033[0;31m'
        YELLOW='\033[1;33m'
        NC='\033[0m'

        echo -e "${YELLOW}=== MeshCom T-Beam Linux Flashing Script ===${NC}"

        if ! command -v esptool.py &> /dev/null; then
            echo -e "${RED}Error: esptool.py is not installed.${NC}"
            echo "Please install it via Arch Linux e.g.: yay esptool or via pip: pip install esptool"
            exit 1
        fi

        PORT=$(ls /dev/ttyUSB* /dev/ttyACM* 2>/dev/null | head -n 1)
        if [ -z "$PORT" ]; then
            echo -e "${RED}Error: No connected T-Beam (ttyUSB/ttyACM) found!${NC}"
            exit 1
        fi
        echo -e "${GREEN}Detected T-Beam on port:${NC} $PORT"

        # Dynamic Permission Check: Determine required group for the specific TTY device
        REQUIRED_GROUP=$(stat -c '%G' "$PORT")
        if [ "$REQUIRED_GROUP" != "root" ]; then
            if ! groups "$USER" | grep -q "\b${REQUIRED_GROUP}\b"; then
                echo -e "${RED}Error: You do not have permissions to access $PORT.${NC}"
                echo -e "The device belongs to the group: ${YELLOW}$REQUIRED_GROUP${NC}"
                echo -e "Please add your user to this group by running:"
                echo -e "  ${GREEN}sudo usermod -aG $REQUIRED_GROUP \$USER${NC}"
                echo -e "After running the command, please log out and log back in for changes to take effect."
                exit 1
            fi
        fi

        FIRMWARE="ttgo_tbeam.bin"
        if [ ! -f "$FIRMWARE" ]; then
            echo -e "${RED}Error: File '$FIRMWARE' not found!${NC}"
            exit 1
        fi

        # Determine flash strategy based on bootloader file availability
        if [ -f "$BOOTLOADER" ]; then
            echo -e "${GREEN}Bootloader found!${NC} Flashing Bootloader (0x1000) and Firmware (0x10000)..."
            esptool.py --chip esp32 --port "$PORT" --baud 921600 write_flash -z 0x1000 "$BOOTLOADER" 0x10000 "$FIRMWARE"
        else
            echo -e "${YELLOW}No bootloader found.${NC} Flashing Firmware only (0x10000)..."
            esptool.py --chip esp32 --port "$PORT" --baud 921600 write_flash -z 0x10000 "$FIRMWARE"
        fi

        if [ $? -eq 0 ]; then
            echo -e "${GREEN}=== Success! T-Beam successfully updated ===${NC}"
        else
            echo -e "${RED}=== Flash failed! ===${NC}"
            exit 1
        fi
        EOF
        chmod +x .pio/build/ttgo_tbeam/flash_tbeam.sh

        # 2. Create the smart Windows Batch Script
        cat << 'EOF' > .pio/build/ttgo_tbeam/flash_tbeam.bat
        @echo off
        setlocal enabledelayedexpansion
        echo ===================================================
        echo === MeshCom T-Beam Windows Flashing Script =======
        echo ===================================================

        set "FIRMWARE=ttgo_tbeam.bin"
        set "BOOTLOADER=bootloader.bin"

        if not exist "%FIRMWARE%" (
            echo [ERROR] File "%FIRMWARE%" not found!
            pause
            exit /b 1
        )

        set "COMPORT="
        for /f "tokens=2 delims=()" %%A in ('wmic path Win32_PnPEntity get Name ^| findstr /i "COM" ^| findstr /i "Silicon CP210 CH340 CH9102 USB-to-UART"') do set "COMPORT=%%A"
        if "%COMPORT%"="" (
            for /f "tokens=2 delims=()" %%A in ('wmic path Win32_PnPEntity get Name ^| findstr /i "(COM"') do set "COMPORT=%%A"
        )
        if "%COMPORT%"="" (
            echo [ERROR] No T-Beam or USB-UART bridge detected!
            pause
            exit /b 1
        )
        echo [INFO] Detected T-Beam on port: %COMPORT%

        if exist "%BOOTLOADER%" (
            echo [INFO] Bootloader found! Flashing Bootloader [0x1000] and Firmware [0x10000]...
            esptool.py --chip esp32 --port %COMPORT% --baud 921600 write_flash -z 0x1000 "%BOOTLOADER%" 0x10000 "%FIRMWARE%"
        ) else (
            echo [INFO] No bootloader found. Flashing Firmware only [0x10000]...
            esptool.py --chip esp32 --port %COMPORT% --baud 921600 write_flash -z 0x10000 "%FIRMWARE%"
        )

        if %ERRORLEVEL% EQU 0 (
            echo === SUCCESS! T-Beam successfully updated ===
        ) else (
            echo [ERROR] Flash failed!
        )
        pause
        EOF

    # Uploads the single T-Beam binary directly without any zip compression
    - name: Upload T-Beam Firmware and Flashing Scripts (Unzipped Bundle)
      uses: actions/upload-artifact@v7
      with:
        name: ttgo-tbeam-desktop-flasher
        path: |
          .pio/build/ttgo_tbeam/ttgo_tbeam.bin
          .pio/build/ttgo_tbeam/bootloader.bin
          .pio/build/ttgo_tbeam/flash_tbeam.sh
          .pio/build/ttgo_tbeam/flash_tbeam.bat
        archive: false
        retention-days: 14
