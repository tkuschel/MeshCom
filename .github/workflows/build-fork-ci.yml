name: Automated Fork CI

on:
  push:
    branches:
    - build-fork-ci
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Which branch do you want to build and test?'
        required: true
        default: 'main'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # CRITICAL: Ensures this workflow only runs inside your personal fork
    if: github.repository == 'tkuschel/MeshCom'

    permissions:
      contents: read # Changed from write since we don't create an official Release anymore

    steps:
    # 1. Checkout the target branch instead of the workflow branch
    - name: Checkout Target Branch
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.inputs.target_branch || github.ref }}

    # 2. Set up Python environment first so that pip paths are correctly resolved
    - name: Set up Python ^3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    # 3. Cache global PlatformIO directories, local build files, and pip downloads
    # Uses a dynamic key based on platformio.ini content to auto-invalidate when dependencies change
    - name: Cache PlatformIO
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/pip
          ~/.platformio
          .pio
        key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-

    # 4. Install PlatformIO Core and the required intelhex extension in a single, quiet command
    - name: Install PlatformIO Core
      run: python -m pip install --quiet --upgrade pip platformio intelhex

    # 5. Pre-install required hardware platforms globally (heavily speeds up via the fixed cache)
    - name: Install RAK Deps
      run: pio pkg install --silent --global --platform nordicnrf52

    - name: Install ESP32 platform
      run: pio pkg install --silent --global --platform espressif32

    # 6. Inject the custom LilyGo T-Beam Supreme board definition into the Espressif32 framework
    - name: Add T-Beam Supreme board definition
      run: |
        mkdir -p ~/.platformio/platforms/espressif32/boards
        wget --quiet -O ~/.platformio/platforms/espressif32/boards/t-beams3-supreme.json https://raw.githubusercontent.com/Xinyuan-LilyGO/LilyGo-LoRa-Series/master/boards/t-beams3-supreme.json

    # 7. Compile all projects defined in the workspace silently
    - name: Build all Projects
      run: pio run --silent

    # 8. Download the official Microsoft UF2 conversion utility once to avoid redundant downloads
    - name: Download UF2 Converter Tools
      run: |
        wget --quiet https://raw.githubusercontent.com/microsoft/uf2/refs/heads/master/utils/uf2conv.py
        wget --quiet https://raw.githubusercontent.com/microsoft/uf2/refs/heads/master/utils/uf2families.json

    # 9. Convert compiled .hex binaries into flashable .uf2 files for each target board
    - name: Convert RAK to UF2
      run: python3 uf2conv.py .pio/build/wiscore_rak4631/firmware.hex -c -o .pio/build/wiscore_rak4631/wiscore_rak4631.uf2 -f 0xADA52840

    - name: Convert HELTEC_T114 to UF2
      run: python3 uf2conv.py .pio/build/heltec_t114/firmware.hex -c -o .pio/build/heltec_t114/heltec_t114.uf2 -f 0xADA52840

    - name: Convert T_ECHO to UF2
      run: python3 uf2conv.py .pio/build/t_echo/firmware.hex -c -o .pio/build/t_echo/t_echo.uf2 -f 0xADA52840

    # 10. Rename Files and Print Progress
    - name: Rename Files and Print Progress
      run: |
        echo "=== Starting File Renaming Process ==="

        echo "Processing DevKitC and T-Deck boards..."
        # Automatically loop through all build directories to rename firmware files dynamically
        # This handles DevKitC, Heltec, TTGO, LilyGo, and any future boards automatically
        for dir in .pio/build/*/; do
          if [ -d "$dir" ]; then
            # Extract the pure board name from the directory path
            board=$(basename "$dir")

            # 1. Rename standard ESP32 firmware binaries
            if [ -f "${dir}firmware.bin" ]; then
              echo "Processing binary for board: $board"
              mv "${dir}firmware.bin" "${dir}${board}.bin"
            fi

            # 2. Rename NRF52 / Nordic ZIP archives (e.g., RAK4631, T-Echo)
            if [ -f "${dir}firmware.zip" ] && [ "$board" != "esp32-S3-safeboot" ]; then
              echo "Processing ZIP for board: $board"
              mv "${dir}firmware.zip" "${dir}${board}.zip"
            fi
          fi
        done

        # Handle the unique exceptions manually
        echo "Processing special bootloaders..."
        if [ -f .pio/build/esp32-S3-safeboot/bootloader.bin ]; then
          mv .pio/build/esp32-S3-safeboot/bootloader.bin .pio/build/esp32-S3-safeboot/bootloader-s3.bin
        fi

        echo "=== File Renaming Successfully Completed ==="
        echo "Listing renamed files in build directory:"
        find .pio/build/ \( -name "*.bin" -o -name "*.zip" -o -name "*.uf2" \)


    # 11. Dynamically create the smart flashing scripts next to the T-Beam binary
    # with optional bootloader detection and group check
    - name: Create Desktop Flashing Scripts
      run: |
        # ----------------------------------------------------------------------
        # 1. Universal Linux Shell Script
        # ----------------------------------------------------------------------
        cat << 'EOF' > flash_esp32_board.sh
        #!/usr/bin/env bash
        GREEN='\033[0;32m'
        RED='\033[0;31m'
        YELLOW='\033[1;33m'
        NC='\033[0m'

        echo -e "${YELLOW}=== MeshCom Universal ESP32 Flashing Script ===${NC}"

        if ! command -v esptool.py &> /dev/null; then
            echo -e "${RED}Error: esptool.py is not installed.${NC}"
            echo "Please install it via your package manager or pip: 'pip install esptool'"
            exit 1
        fi

        # Auto-detect Firmware File
        if [ -f "ttgo_tbeam.bin" ]; then
            FIRMWARE="ttgo_tbeam.bin"
            BOARD_NAME="T-Beam"
        elif [ -f "ttgo-lora32-v21.bin" ]; then
            FIRMWARE="ttgo-lora32-v21.bin"
            BOARD_NAME="TTGO LoRa32 v2.1"
        else
            echo -e "${RED}Error: No matching firmware binary found in this folder!${NC}"
            exit 1
        fi

        echo -e "${GREEN}Selected Firmware:${NC} $FIRMWARE ($BOARD_NAME)"
        PORT=$(ls /dev/ttyUSB* /dev/ttyACM* 2>/dev/null | head -n 1)
        if [ -z "$PORT" ]; then
            echo -e "${RED}Error: No connected ESP32 Board (ttyUSB/ttyACM) found!${NC}"
            exit 1
        fi
        echo -e "${GREEN}Detected Board on port:${NC} $PORT"

        # Dynamic Permission Check: Determine required group for the specific TTY device
        REQUIRED_GROUP=$(stat -c '%G' "$PORT")
        if [ "$REQUIRED_GROUP" != "root" ]; then
            if ! groups "$USER" | grep -q "\b${REQUIRED_GROUP}\b"; then
                echo -e "${RED}Error: You do not have permissions to access $PORT.${NC}"
                echo -e "The device belongs to the group: ${YELLOW}$REQUIRED_GROUP${NC}"
                echo -e "Please add your user to this group by running:"
                echo -e "  ${GREEN}sudo usermod -aG $REQUIRED_GROUP \$USER${NC}"
                echo -e "After running the command, please log out and log back in for the changes to take effect."
                exit 1
            fi
        fi

        BOOTLOADER="bootloader.bin"

        if [ -f "$BOOTLOADER" ]; then
            echo -e "${GREEN}Bootloader found!${NC} Flashing Bootloader (0x1000) and Firmware (0x10000)..."
            esptool.py --chip esp32 --port "$PORT" --baud 921600 write_flash -z 0x1000 "$BOOTLOADER" 0x10000 "$FIRMWARE"
        else
            echo -e "${YELLOW}No bootloader found.${NC} Flashing Firmware only (0x10000)..."
            esptool.py --chip esp32 --port "$PORT" --baud 921600 write_flash -z 0x10000 "$FIRMWARE"
        fi

        if [ $? -eq 0 ]; then
            echo -e "${GREEN}=== Success! $BOARD_NAME successfully updated ===${NC}"
        else
            echo -e "${RED}=== Flash failed! ===${NC}"
            exit 1
        fi
        EOF
        chmod +x flash_esp32_board.sh

        # ----------------------------------------------------
        # 2. Universal Windows Batch Script
        # ----------------------------------------------------
        cat << 'EOF' > flash_esp32_board.bat
        @echo off
        setlocal enabledelayedexpansion
        echo ===================================================
        echo === MeshCom Universal ESP32 Windows Flashing ======
        echo ===================================================

        set "BOOTLOADER=bootloader.bin"
        set "FIRMWARE="
        set "BOARD_NAME="

        if exist "ttgo_tbeam.bin" (
            set "FIRMWARE=ttgo_tbeam.bin"
            set "BOARD_NAME=T-Beam"
        ) else if exist "ttgo-lora32-v21.bin" (
            set "FIRMWARE=ttgo-lora32-v21.bin"
            set "BOARD_NAME=TTGO LoRa32 v2.1"
        )

        if "%FIRMWARE%"="" (
            echo [ERROR] No matching firmware binary found in this folder!
            pause
            exit /b 1
        )

        echo [INFO] Selected Firmware: %FIRMWARE% (%BOARD_NAME%)

        set "COMPORT="
        for /f "tokens=2 delims=()" %%A in ('wmic path Win32_PnPEntity get Name ^| findstr /i "COM" ^| findstr /i "Silicon CP210 CH340 CH9102 USB-to-UART"') do set "COMPORT=%%A"
        if "%COMPORT%"="" (
            for /f "tokens=2 delims=()" %%A in ('wmic path Win32_PnPEntity get Name ^| findstr /i "(COM"') do set "COMPORT=%%A"
        )
        if "%COMPORT%"="" (
            echo [ERROR] No ESP32 Board or USB-UART bridge detected!
            pause
            exit /b 1
        )
        echo [INFO] Detected Board on port: %COMPORT%

        if exist "%BOOTLOADER%" (
            echo [INFO] Bootloader found! Flashing Bootloader [0x1000] and Firmware [0x10000]...
            esptool.py --chip esp32 --port %COMPORT% --baud 921600 write_flash -z 0x1000 "%BOOTLOADER%" 0x10000 "%FIRMWARE%"
        ) else (
            echo [INFO] No bootloader found. Flashing Firmware only [0x10000]...
            esptool.py --chip esp32 --port %COMPORT% --baud 921600 write_flash -z 0x10000 "%FIRMWARE%"
        )

        if %ERRORLEVEL% EQU 0 (
            echo === SUCCESS! %BOARD_NAME% successfully updated ===
        ) else (
            echo [ERROR] Flash failed!
        )
        pause
        EOF

        # ----------------------------------------------------
        # 3. Distribute Scripts into target build directories
        # ----------------------------------------------------
        mkdir -p .pio/build/ttgo_tbeam
        mkdir -p .pio/build/ttgo-lora32-v21

        cp flash_esp32_board.sh .pio/build/ttgo_tbeam/
        cp flash_esp32_board.bat .pio/build/ttgo_tbeam/

        cp flash_esp32_board.sh .pio/build/ttgo-lora32-v21/
        cp flash_esp32_board.bat .pio/build/ttgo-lora32-v21/

    # 12. Upload the T-Beam binary, bootloader and scripts with zip compression
    - name: Upload Compiled Firmware Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: firmware-build-${{ github.event.inputs.target_branch || github.ref_name }}
        path: |
          .pio/build/**/*.bin
          .pio/build/**/*.zip
          .pio/build/**/*.uf2
        retention-days: 7 # Artifacts will be automatically deleted after 7 days

    # 13. Upload T-Beam Bundle (ZIP)
    - name: Upload T-Beam Firmware and Flashing Scripts (Bundle)
      uses: actions/upload-artifact@v7
      with:
        name: ttgo-tbeam-desktop-flasher-${{ github.event.inputs.target_branch || github.ref_name }}
        path: |
          .pio/build/ttgo_tbeam/ttgo_tbeam.bin
          .pio/build/ttgo_tbeam/bootloader.bin
          .pio/build/ttgo_tbeam/flash_tbeam.sh
          .pio/build/ttgo_tbeam/flash_tbeam.bat
        archive: true
        retention-days: 14

    # 14. Upload the single T-Beam binary directly without any zip compression
    - name: Upload T-Beam Firmware (firmware binary w/o bootloader)
      uses: actions/upload-artifact@v7
      with:
        path: .pio/build/ttgo_tbeam/ttgo_tbeam.bin
        archive: false
        retention-days: 14

    # 15. Upload TTGO LoRa32 v2.1 Bundle (ZIP/Archive)
    - name: Upload TTGO LoRa32 v2.1 Firmware and Flashing Scripts (Bundle)
      uses: actions/upload-artifact@v7
      with:
        name: ttgo-lora32-v21-desktop-flasher-${{ github.event.inputs.target_branch || github.ref_name }}
        path: |
          .pio/build/ttgo-lora32-v21/ttgo-lora32-v21.bin
          .pio/build/ttgo-lora32-v21/bootloader.bin
          .pio/build/ttgo-lora32-v21/flash_esp32_board.sh
          .pio/build/ttgo-lora32-v21/flash_esp32_board.bat
        archive: true
        retention-days: 14

    # 16. Upload TTGO LoRa32 v2.1 Raw Binary (Uncompressed)
    - name: Upload TTGO LoRa32 v2.1 Firmware (firmware binary w/o bootloader)
      uses: actions/upload-artifact@v7
      with:
        path: .pio/build/ttgo-lora32-v21/ttgo-lora32-v21.bin
        archive: false
        retention-days: 14
